[workspace]
resolver = "2"
members = ["crates/core", "crates/ndstrl", "crates/desk"]
exclude = ["bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/swperb/ndstrl"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
ignore = "0.4"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
similar = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
